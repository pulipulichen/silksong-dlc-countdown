name: Build Google Play AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Generate TWA project
        env:
          CI: 'true'
        run: |
          mkdir android-twa
          cd android-twa
          bubblewrap init --manifest https://pulipulichen.github.io/silksong-dlc-countdown/manifest.webmanifest
          # Ensure the generated app is configured for the project GitHub Pages origin.
          test -f build.gradle || test -f app/build.gradle
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-twa/release.keystore
      - name: Build signed AAB
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          bubblewrap build --skipPwaValidation
          find . -name '*.aab' -print
          test -n "$(find . -name '*.aab' -print -quit)"
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: silksong-dlc-countdown-aab
          path: android-twa/**/*.aab
          if-no-files-found: error
          retention-days: 3
