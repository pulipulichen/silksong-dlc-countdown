name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unique increasing Google Play versionCode (integer)'
        required: true
        default: '1'
      version_name:
        description: 'Android versionName'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Missing signing secret. See README Google Play AAB section."
              exit 1
            fi
          done
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          chmod 600 android/release.keystore
      - name: Verify signing key
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore android/release.keystore -storepass:env STOREPASS -alias upload
      - name: Prepare TWA manifest and Bubblewrap
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::version_code must be a positive integer"; exit 1; }
          node -e 'const fs=require("fs"); const p="android/twa-manifest.json"; const m=JSON.parse(fs.readFileSync(p)); m.appVersionCode=Number(process.env.VERSION_CODE); m.appVersion=process.env.VERSION_NAME; fs.writeFileSync(p,JSON.stringify(m,null,2));'
          npm install --global @bubblewrap/cli@1.22.0
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"
      - name: Generate Android project without prompts
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation --signingKeyPath=release.keystore --signingKeyAlias=upload
          test -s app-release-bundle.aab
          mkdir -p ../aab
          cp app-release-bundle.aab ../aab/silksong-dlc-countdown.aab
      - uses: actions/upload-artifact@v4
        with:
          name: silksong-dlc-countdown-aab
          path: aab/silksong-dlc-countdown.aab
          if-no-files-found: error
          retention-days: 3
