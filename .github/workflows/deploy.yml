name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js on GitHub runner
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies on GitHub runner
        run: npm install --no-audit --no-fund
      - name: Compile TypeScript and build production site
        run: npm run build
      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/og-preview.png
          test -s dist/favicon.svg
          node scripts/verify-icons.mjs
          find dist/assets -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -type f -name '*.css' -print -quit | grep -q .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Require Actions-only Pages publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch publishing can overwrite the compiled site with unbuilt source files."
            exit 1
          fi
      - name: Upload compiled site to GitHub Pages
        id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 3
      - name: Wait for the Pages artifact to be listed
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Pages upload did not return an artifact ID."
            exit 1
          fi

          # Upload finalization can precede visibility in the artifact listing.
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"
          for attempt in {1..12}; do
            if artifact_ids=$(gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') &&
              grep -Fxq "$ARTIFACT_ID" <<< "$artifact_ids"; then
              echo "Pages artifact $ARTIFACT_ID is listed for run $GITHUB_RUN_ID."
              exit 0
            fi
            if (( attempt < 12 )); then
              echo "Waiting for Pages artifact $ARTIFACT_ID (attempt $attempt of 12)."
              sleep 5
            fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not appear in the listing for run $GITHUB_RUN_ID."
          exit 1
      - name: Deploy compiled site
        id: deployment
        uses: actions/deploy-pages@v4
